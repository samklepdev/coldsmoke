services:
  postgres:
    image: postgres:16-alpine
    container_name: coldsmoke-dev-db
    environment:
      POSTGRES_USER: coldsmoke
      POSTGRES_PASSWORD: coldsmoke
      POSTGRES_DB: coldsmoke
    ports:
      - "54328:5432"
    volumes:
      - coldsmoke-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldsmoke -d coldsmoke"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  coldsmoke-dev-data:
