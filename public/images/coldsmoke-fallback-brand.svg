<svg width="1600" height="1600" viewBox="0 0 1600 1600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161C"/>
      <stop offset="0.55" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#6E8CA8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6E8CA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E949C"/>
      <stop offset="0.5" stop-color="#EBEEF1"/>
      <stop offset="1" stop-color="#8E949C"/>
    </linearGradient>
    <filter id="smoke2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg2)"/>
  <rect width="1600" height="1600" fill="url(#glow2)"/>

  <!-- smoke wisps -->
  <g filter="url(#smoke2)" stroke="#AEB4BC" fill="none" opacity="0.08">
    <path d="M520 400 C 440 620, 640 760, 520 980 C 430 1150, 620 1240, 520 1440" stroke-width="7"/>
    <path d="M1080 380 C 1180 620, 980 760, 1100 1000 C 1190 1190, 1000 1260, 1090 1460" stroke-width="6"/>
  </g>

  <!-- thin frame -->
  <rect x="150" y="150" width="1300" height="1300" fill="none" stroke="#33353B" stroke-width="1.5"/>
  <rect x="168" y="168" width="1264" height="1264" fill="none" stroke="#222329" stroke-width="1"/>

  <!-- ember mark -->
  <path d="M800 636 C 780 672, 826 690, 806 738 C 852 714, 846 664, 800 636 Z"
        fill="none" stroke="#9AA0A8" stroke-width="3"/>

  <!-- wordmark -->
  <text x="800" y="852" text-anchor="middle" font-size="92" letter-spacing="26" fill="url(#silver2)" font-weight="300">COLDSMOKE</text>
  <line x1="560" y1="906" x2="1040" y2="906" stroke="#6E7178" stroke-width="1.6"/>
  <text x="800" y="952" text-anchor="middle" font-size="26" letter-spacing="12" fill="#B7BBC1">EAU DE TOILETTE</text>

  <!-- tagline -->
  <text x="800" y="1070" text-anchor="middle" font-size="30" letter-spacing="6" fill="#8D9198" font-style="italic">Cold air. Dark spice.</text>

  <!-- url -->
  <text x="800" y="1360" text-anchor="middle" font-size="22" letter-spacing="7" fill="#6E727A">wearcoldsmoke.com</text>
</svg>
