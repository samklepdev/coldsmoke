<svg width="1600" height="1600" viewBox="0 0 1600 1600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161C"/>
      <stop offset="0.55" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="coldglow" cx="0.5" cy="0.34" r="0.42">
      <stop offset="0" stop-color="#6E8CA8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6E8CA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272E"/>
      <stop offset="0.5" stop-color="#131319"/>
      <stop offset="1" stop-color="#0A0A0E"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4B4D57" stop-opacity="0.9"/>
      <stop offset="0.12" stop-color="#4B4D57" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A2B31" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C5F66"/>
      <stop offset="0.28" stop-color="#C7CBD0"/>
      <stop offset="0.5" stop-color="#EDEFF2"/>
      <stop offset="0.72" stop-color="#B7BBC1"/>
      <stop offset="1" stop-color="#55585F"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E949C"/>
      <stop offset="0.5" stop-color="#E9ECF0"/>
      <stop offset="1" stop-color="#8E949C"/>
    </linearGradient>
    <filter id="smoke" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowblur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>
  <rect width="1600" height="1600" fill="url(#coldglow)"/>

  <!-- smoke wisps behind bottle -->
  <g filter="url(#smoke)" stroke="#AEB4BC" fill="none" opacity="0.10">
    <path d="M700 560 C 640 700, 780 820, 690 980 C 620 1120, 760 1180, 700 1300" stroke-width="6"/>
    <path d="M905 540 C 980 700, 850 820, 940 1000 C 1000 1140, 880 1200, 930 1320" stroke-width="5"/>
  </g>

  <!-- cold light halo -->
  <ellipse cx="800" cy="560" rx="240" ry="120" fill="#9DB4CC" opacity="0.10" filter="url(#glowblur)"/>

  <!-- ===== bottle ===== -->
  <!-- cap -->
  <rect x="720" y="470" width="160" height="98" rx="16" fill="url(#metal)"/>
  <rect x="720" y="470" width="160" height="20" rx="10" fill="#FFFFFF" opacity="0.18"/>
  <!-- neck -->
  <rect x="746" y="560" width="108" height="46" fill="#17171C"/>
  <!-- collar -->
  <rect x="734" y="596" width="132" height="20" rx="4" fill="url(#metal)"/>
  <!-- body -->
  <rect x="610" y="612" width="380" height="596" rx="24" fill="url(#glass)"/>
  <rect x="610" y="612" width="380" height="596" rx="24" fill="url(#glassEdge)"/>
  <!-- soft vertical sheen along left edge -->
  <rect x="628" y="628" width="46" height="564" rx="20" fill="#FFFFFF" opacity="0.04"/>

  <!-- ember mark -->
  <path d="M800 726 C 788 746, 816 756, 804 782 C 828 770, 824 742, 800 726 Z"
        fill="none" stroke="#9AA0A8" stroke-width="2.4"/>

  <!-- wordmark -->
  <text x="800" y="900" text-anchor="middle" font-size="52" letter-spacing="15" fill="url(#silver)" font-weight="300">COLDSMOKE</text>
  <line x1="654" y1="932" x2="946" y2="932" stroke="#6E7178" stroke-width="1.4"/>
  <text x="800" y="966" text-anchor="middle" font-size="19" letter-spacing="8" fill="#B7BBC1">EAU DE TOILETTE</text>

  <text x="800" y="1150" text-anchor="middle" font-size="22" letter-spacing="6" fill="#CDD1D6">50 mL · 1.7 FL OZ</text>

  <!-- reflection -->
  <g transform="translate(0,2416) scale(1,-1)" opacity="0.22">
    <rect x="610" y="612" width="380" height="596" rx="24" fill="url(#glass)"/>
  </g>
  <rect x="560" y="1208" width="480" height="240" fill="url(#bg)" opacity="0.72"/>

  <!-- floor shadow -->
  <ellipse cx="800" cy="1216" rx="230" ry="26" fill="#000000" opacity="0.5" filter="url(#smoke)"/>
</svg>
