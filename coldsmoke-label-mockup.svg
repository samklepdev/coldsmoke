<svg width="1160" height="900" viewBox="0 0 1160 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171B"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA0A8"/>
      <stop offset="0.5" stop-color="#E4E7EC"/>
      <stop offset="1" stop-color="#9AA0A8"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1160" height="900" fill="#EDEDF0"/>

  <!-- Title block -->
  <text x="100" y="70" font-size="26" letter-spacing="6" fill="#1A1A1E" font-weight="600">COLDSMOKE</text>
  <text x="100" y="96" font-size="13" letter-spacing="1" fill="#6B6E75">Label mockup · 50 mL Eau de Toilette · front + information panel · not to final scale</text>
  <line x1="100" y1="116" x2="1060" y2="116" stroke="#C7C8CD" stroke-width="1"/>

  <!-- ================= FRONT / PDP ================= -->
  <g>
    <!-- crop ticks -->
    <g stroke="#9A9CA2" stroke-width="1">
      <line x1="90" y1="150" x2="90" y2="164"/><line x1="90" y1="150" x2="104" y2="150"/>
      <line x1="460" y1="150" x2="460" y2="164"/><line x1="460" y1="150" x2="446" y2="150"/>
      <line x1="90" y1="730" x2="90" y2="716"/><line x1="90" y1="730" x2="104" y2="730"/>
      <line x1="460" y1="730" x2="460" y2="716"/><line x1="460" y1="730" x2="446" y2="730"/>
    </g>

    <rect x="100" y="160" width="360" height="560" rx="6" fill="url(#panel)"/>
    <rect x="112" y="172" width="336" height="536" rx="3" fill="none" stroke="#4A4B51" stroke-width="1"/>
    <!-- safe area -->
    <rect x="126" y="186" width="308" height="508" rx="2" fill="none" stroke="#3A3B40" stroke-width="1" stroke-dasharray="4 5"/>

    <!-- ember mark -->
    <path d="M280 214 C 272 226, 290 232, 282 246 C 296 240, 294 224, 280 214 Z" fill="none" stroke="#8A8D94" stroke-width="1.4"/>

    <!-- wordmark -->
    <text x="280" y="330" text-anchor="middle" font-size="33" letter-spacing="9" fill="url(#silver)" font-weight="300">COLDSMOKE</text>
    <line x1="188" y1="352" x2="372" y2="352" stroke="#6E7178" stroke-width="1"/>
    <text x="280" y="378" text-anchor="middle" font-size="12" letter-spacing="4" fill="#B7BBC1">EAU DE TOILETTE SPRAY</text>

    <!-- tagline -->
    <text x="280" y="470" text-anchor="middle" font-size="13" letter-spacing="3" fill="#8D9198" font-style="italic">Cold air. Dark spice.</text>

    <!-- net qty -->
    <text x="280" y="648" text-anchor="middle" font-size="15" letter-spacing="3" fill="#D2D5DA">50 mL  ·  1.7 FL OZ</text>
    <text x="280" y="684" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7E828A">wearcoldsmoke.com</text>

    <text x="100" y="760" font-size="13" fill="#1A1A1E" font-weight="600">FRONT · Principal Display Panel</text>
    <text x="100" y="780" font-size="11" fill="#6B6E75">Required: statement of identity + net quantity (metric &amp; US customary)</text>
  </g>

  <!-- ================= BACK / INFO PANEL ================= -->
  <g>
    <g stroke="#9A9CA2" stroke-width="1">
      <line x1="550" y1="150" x2="550" y2="164"/><line x1="550" y1="150" x2="564" y2="150"/>
      <line x1="1070" y1="150" x2="1070" y2="164"/><line x1="1070" y1="150" x2="1056" y2="150"/>
      <line x1="550" y1="730" x2="550" y2="716"/><line x1="550" y1="730" x2="564" y2="730"/>
      <line x1="1070" y1="730" x2="1070" y2="716"/><line x1="1070" y1="730" x2="1056" y2="730"/>
    </g>

    <rect x="560" y="160" width="500" height="560" rx="6" fill="url(#panel)"/>
    <rect x="572" y="172" width="476" height="536" rx="3" fill="none" stroke="#4A4B51" stroke-width="1"/>

    <!-- mini wordmark header -->
    <text x="590" y="210" font-size="15" letter-spacing="6" fill="#C9CDD2" font-weight="300">COLDSMOKE</text>
    <text x="1030" y="210" text-anchor="end" font-size="10" letter-spacing="2" fill="#7E828A">EAU DE TOILETTE · 50 mL</text>
    <line x1="590" y1="224" x2="1030" y2="224" stroke="#3E3F45" stroke-width="1"/>

    <!-- Ingredients -->
    <text x="590" y="256" font-size="10" letter-spacing="3" fill="#8D9198">INGREDIENTS</text>
    <text x="590" y="276" font-size="12" fill="#B7BBC1">
      <tspan x="590" dy="0">Alcohol Denat., Aqua (Water), Parfum (Fragrance), Glycerin,</tspan>
      <tspan x="590" dy="17">Limonene, Linalool, Coumarin, Citral.</tspan>
    </text>
    <text x="590" y="313" font-size="9" fill="#63666D" font-style="italic">Allergen tail illustrative — set from supplier certificate.</text>

    <!-- Responsible person -->
    <text x="590" y="348" font-size="10" letter-spacing="3" fill="#8D9198">RESPONSIBLE PERSON</text>
    <text x="590" y="368" font-size="12" fill="#B7BBC1">Distributed by Coldsmoke LLC, [Street], [City, ST ZIP], USA</text>

    <!-- Adverse event -->
    <text x="590" y="402" font-size="10" letter-spacing="3" fill="#8D9198">QUESTIONS / REPORT AN ADVERSE EVENT</text>
    <text x="590" y="422" font-size="12" fill="#B7BBC1">care@wearcoldsmoke.com  ·  [US phone]  ·  [US mailing address]</text>

    <!-- Warnings -->
    <text x="590" y="456" font-size="10" letter-spacing="3" fill="#8D9198">WARNINGS</text>
    <text x="590" y="476" font-size="11.5" fill="#A8ACB3">
      <tspan x="590" dy="0">FLAMMABLE. Keep away from heat, flame &amp; direct sunlight. For</tspan>
      <tspan x="590" dy="16">external use only. Avoid contact with eyes; if contact occurs,</tspan>
      <tspan x="590" dy="16">rinse thoroughly. Discontinue use if irritation occurs. Keep</tspan>
      <tspan x="590" dy="16">out of reach of children.</tspan>
    </text>

    <!-- footer divider -->
    <line x1="590" y1="600" x2="1030" y2="600" stroke="#3E3F45" stroke-width="1"/>

    <!-- LOT -->
    <text x="590" y="632" font-size="10" letter-spacing="2" fill="#8D9198">LOT [######]</text>
    <text x="590" y="650" font-size="10" letter-spacing="2" fill="#8D9198">MFG [MM/YYYY]</text>

    <!-- PAO icon -->
    <g transform="translate(720,612)">
      <path d="M6 10 h34 v26 a4 4 0 0 1 -4 4 h-26 a4 4 0 0 1 -4 -4 Z" fill="none" stroke="#A8ACB3" stroke-width="1.4"/>
      <path d="M6 10 c 4 -8, 30 -8, 34 0" fill="none" stroke="#A8ACB3" stroke-width="1.4"/>
      <text x="23" y="32" text-anchor="middle" font-size="13" fill="#C9CDD2" font-weight="600">12M</text>
    </g>
    <text x="700" y="672" font-size="9" fill="#63666D">Period-After-Opening</text>

    <!-- barcode placeholder -->
    <g transform="translate(900,610)">
      <rect x="0" y="0" width="130" height="46" fill="#F3F3F5"/>
      <g fill="#0A0A0C">
        <rect x="8" y="6" width="2" height="30"/><rect x="12" y="6" width="1" height="30"/>
        <rect x="16" y="6" width="3" height="30"/><rect x="22" y="6" width="1" height="30"/>
        <rect x="26" y="6" width="2" height="30"/><rect x="31" y="6" width="4" height="30"/>
        <rect x="38" y="6" width="1" height="30"/><rect x="42" y="6" width="2" height="30"/>
        <rect x="47" y="6" width="3" height="30"/><rect x="53" y="6" width="1" height="30"/>
        <rect x="57" y="6" width="2" height="30"/><rect x="62" y="6" width="4" height="30"/>
        <rect x="69" y="6" width="1" height="30"/><rect x="73" y="6" width="3" height="30"/>
        <rect x="79" y="6" width="2" height="30"/><rect x="84" y="6" width="1" height="30"/>
        <rect x="88" y="6" width="3" height="30"/><rect x="94" y="6" width="2" height="30"/>
        <rect x="99" y="6" width="1" height="30"/><rect x="103" y="6" width="4" height="30"/>
        <rect x="110" y="6" width="2" height="30"/><rect x="115" y="6" width="1" height="30"/>
        <rect x="119" y="6" width="3" height="30"/>
      </g>
      <text x="65" y="44" text-anchor="middle" font-size="7" fill="#63666D">UPC — placeholder</text>
    </g>

    <text x="590" y="700" font-size="10.5" letter-spacing="2" fill="#7E828A">wearcoldsmoke.com</text>

    <text x="560" y="760" font-size="13" fill="#1A1A1E" font-weight="600">BACK · Information Panel</text>
    <text x="560" y="780" font-size="11" fill="#6B6E75">Required: ingredients (INCI) · responsible person · adverse-event contact · warnings</text>
  </g>

  <!-- Print notes -->
  <line x1="100" y1="812" x2="1060" y2="812" stroke="#C7C8CD" stroke-width="1"/>
  <text x="100" y="836" font-size="12" fill="#1A1A1E" font-weight="600">PRINT NOTES</text>
  <text x="100" y="858" font-size="11" fill="#5B5E65">Add 3 mm bleed on all sides · keep text ≥3 mm from trim (dashed = safe area) · outline all type · build in CMYK or spot (metallic silver suits the collar)</text>
  <text x="100" y="878" font-size="11" fill="#5B5E65">Placeholder face is Helvetica/Arial — swap to the final brand typeface · dashed guides, crop ticks &amp; the barcode do not print</text>
</svg>
